name: "sigma-services"
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/app
        ports:
            - "8000:8000"
        depends_on:
            - database

    database:
        image: mariadb
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_DATABASE: sigma
            MYSQL_USER: root
            MYSQL_PASSWORD: ""
        volumes:
            - .data:/var/lib/mysql
        ports:
            - "3306:3306"
